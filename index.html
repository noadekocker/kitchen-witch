<style>
/* Kitchen Witch huisstijl, optie A: Hemel als rustige achtergrond, witte kaarten, Biet voor logo en knoppen, Bos voor tekst */
:root{
  --bos:#1B3907;--biet:#BD475F;--hemel:#D6E7FD;--limoen:#C9DB84;--rabarber:#FEC2E6;--wit:#FFFFFF;
  --bg:#FBF7F8;--surface:#FFFFFF;--ink:#1B3907;--muted:#4A5E3C;--line:#D6E7FD;--field:#F2F7FF;
  --title:#BD475F;--accent:#BD475F;
  --b1:#BD475F;--b1-ink:#FFFFFF;--b2:#1B3907;--b2-ink:#D6E7FD;--b3:#FEC2E6;--b3-ink:#1B3907;--b4:#D6E7FD;--b4-ink:#1B3907;
  --tip:#D6E7FD;--tip-ink:#1B3907;
  --f-title:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#122806;--surface:#1B3907;--ink:#D6E7FD;--muted:#AFC3D9;--line:#2C5214;--field:#122806;
  --title:#FEC2E6;--accent:#FEC2E6;
  --b1:#BD475F;--b1-ink:#FFFFFF;--b2:#D6E7FD;--b2-ink:#1B3907;--b3:#FEC2E6;--b3-ink:#1B3907;--b4:#C9DB84;--b4-ink:#1B3907;
  --tip:#264A12;--tip-ink:#D6E7FD;color-scheme:dark}
  :root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
:root[data-theme="dark"]{
  --bg:#122806;--surface:#1B3907;--ink:#D6E7FD;--muted:#AFC3D9;--line:#2C5214;--field:#122806;
  --title:#FEC2E6;--accent:#FEC2E6;
  --b1:#BD475F;--b1-ink:#FFFFFF;--b2:#D6E7FD;--b2-ink:#1B3907;--b3:#FEC2E6;--b3-ink:#1B3907;--b4:#C9DB84;--b4-ink:#1B3907;
  --tip:#264A12;--tip-ink:#D6E7FD;color-scheme:dark}
:root[data-theme="dark"] .logo.lt{display:none}:root[data-theme="dark"] .logo.dk{display:block}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
b,strong{font-weight:700}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{display:block;width:min(240px,62vw);height:auto}
.logo.dk{display:none}
.home-head{display:flex;justify-content:center;padding:18px 0 6px}
.inner-head{display:flex;align-items:center;gap:12px}
.icon{width:48px;height:48px;border-radius:13px;background:var(--biet);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 48px;padding:0}
.icon img{width:29px;height:auto}
body[data-page="home"] .inner-head,body[data-page="inner"] .home-head{display:none}
body[data-page="home"] #h1{text-align:center;font-size:22px;color:var(--ink)}
h1{font-family:var(--f-title);font-weight:400;font-size:32px;line-height:1.15;margin:0;color:var(--title);text-wrap:balance}
h2{font-family:var(--f-title);font-weight:400;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
nav.sub{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.sub button{font:inherit;font-size:15px;font-weight:500;border:0;border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer;white-space:nowrap;background:var(--surface);color:var(--ink)}
nav.sub button[aria-selected="true"]{background:var(--b2);color:var(--b2-ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:0 22px;min-height:46px;cursor:pointer;border:0;background:var(--b2);color:var(--b2-ink)}
.btn.primary{background:var(--b1);color:var(--b1-ink)}
.btn.soft{background:var(--b3);color:var(--b3-ink)}
.btn.danger{background:var(--biet);color:#FFFFFF}
.step-d{font-size:18px;line-height:1.5}
.confirm .btn.danger{background:var(--biet);color:#FFFFFF}
.btn.big{font-size:18px;min-height:56px;width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.row.tight>.btn{flex:0 0 auto}
.between{justify-content:space-between}
.tip{background:var(--tip);color:var(--tip-ink);border-radius:16px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.tip b{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.timer{font-family:var(--f-title);font-size:58px;line-height:1;font-variant-numeric:tabular-nums;text-align:center;padding:8px 0;color:var(--title)}
.timer.done{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none}}
@keyframes pulse{50%{opacity:.4}}
.timer-sub{text-align:center;color:var(--muted);font-size:14px}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--biet);border-radius:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.steps li:first-child{border-top:0}
.steps .n,.steps .dur{font-family:var(--f-title);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps li.done{color:var(--muted)}
.steps li.now{font-weight:700}
.steps li.now .n{color:var(--accent)}
.recipe{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;font-size:16px;align-items:baseline}
.recipe span:nth-child(3n+2),.recipe span:nth-child(3n){font-family:var(--f-title);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.recipe span:nth-child(3n){color:var(--muted)}
.recipe .sum{border-top:1px solid var(--line);padding-top:6px}
label{font-weight:500;font-size:15px;display:flex;flex-direction:column;gap:6px}
input,textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
select{font-weight:500;cursor:pointer}
textarea{min-height:76px;resize:vertical}
.temp{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:300;font-size:15px;color:var(--muted)}
.temp input{width:80px;padding:6px 10px}
.stars{display:flex;gap:4px}
.stars button{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:4px}
.stars button.on{color:var(--accent)}
.entry{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:0}
.entry strong{font-family:var(--f-title);font-weight:400;font-size:18px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.score{color:var(--accent);letter-spacing:2px}
.chip{display:inline-block;font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;background:var(--rabarber);color:var(--bos)}
.chip.ok{background:var(--limoen);color:var(--bos)}
.chip.wait{background:var(--hemel);color:var(--bos)}
.chip.bad{background:var(--biet);color:#FFFFFF}
.status{font-size:13px;color:var(--muted);text-align:center}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--biet);border-radius:16px;padding:14px}
ul.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.edit-row{display:grid;grid-template-columns:1fr 90px auto auto;gap:8px;align-items:center}
.chk{display:flex;flex-direction:row;align-items:center;gap:6px;font-weight:300;font-size:14px;color:var(--muted)}
.chk input{width:auto;accent-color:var(--biet)}
.edit-step{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{font:inherit;font-weight:700;background:var(--b4);color:var(--b4-ink);border:0;border-radius:999px;min-width:44px;min-height:44px;padding:0 12px;cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--biet);font-weight:500}
.scoby-big{font-family:var(--f-title);font-size:44px;line-height:1.1;color:var(--title)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:500;font-size:15px;border:0;border-radius:999px;padding:0 16px;min-height:40px;cursor:pointer;background:var(--b4);color:var(--b4-ink)}
.seg button[aria-checked="true"]{background:var(--b2);color:var(--b2-ink);font-weight:700}
.pre{white-space:pre-line}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tile{font:inherit;text-align:left;border:0;border-radius:22px;padding:18px 20px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.tile:focus-visible{outline:3px solid var(--biet);outline-offset:3px}
.tile .t-name{font-family:var(--f-title);font-size:26px;line-height:1.1}
.tile .t-info{font-size:15px;font-weight:400;line-height:1.35}
.tile .t-info b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.tile.zd{background:var(--biet);color:#FFFFFF}
.tile.kb{background:var(--bos);color:var(--hemel)}
.tile.sap{background:var(--limoen);color:var(--bos)}
:root[data-theme="dark"] .tile.kb{background:var(--rabarber);color:var(--bos)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile.kb{background:var(--rabarber);color:var(--bos)}}

/* --- inspiratie-update: zwevende menubalk, portefeuille-kaarten, ring-timer --- */
:root{--dock:#1B3907;--dock-ink:#D6E7FD;--dock-on:#FBF7F8;--dock-on-ink:#1B3907;--shadow:rgba(27,57,7,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dock:#D6E7FD;--dock-ink:#1B3907;--dock-on:#1B3907;--dock-on-ink:#D6E7FD;--shadow:rgba(0,0,0,.4)}}

.top{display:flex;flex-direction:column;gap:4px;padding-top:4px}

.card{border-radius:28px}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:var(--dock);border-radius:999px;padding:7px;display:flex;align-items:center;gap:4px;z-index:20;box-shadow:0 12px 32px var(--shadow)}

.act i{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-title);font-size:18px;color:var(--bos)}

.t-top{display:flex;justify-content:space-between;align-items:center;gap:10px}

.qcard.r{background:var(--rabarber)}.qcard.l{background:var(--limoen)}.qcard.b{background:var(--biet);color:#FFFFFF}.qcard.h{background:var(--surface);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.card,.log .entry,nav.sub button{box-shadow:0 2px 14px var(--shadow-soft)}

.top.home{align-items:center;text-align:center}

.quote{font-family:var(--f-title);font-size:21px;line-height:1.4;color:var(--ink);max-width:28ch;text-wrap:balance;margin:2px 0 6px}

h1{letter-spacing:-.02em}
.timer{font-weight:300}

.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;background:var(--field)}
label.file{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;align-self:flex-start}
details.help{background:var(--surface);border-radius:24px;padding:0;box-shadow:0 2px 14px var(--shadow-soft)}
details.help summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;font-weight:400}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"+";font-size:22px;color:var(--muted);flex:0 0 auto}
details.help[open] summary::after{content:"−"}
details.help .hb{padding:0 20px 18px;display:flex;flex-direction:column;gap:12px}
details.help ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cal i{height:16px;border-radius:5px;background:var(--field);display:block}
.cal i.on{background:var(--limoen)}
.cal i.cur{box-shadow:inset 0 0 0 2px var(--biet)}
.cal span{font-size:11px;color:var(--muted);text-align:center;font-weight:500}
.counter{display:flex;align-items:center;gap:12px}
.counter b{font-size:22px;font-weight:300;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.preview{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:15px}
.preview div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.preview div:first-child{border-top:0}
a.link{color:var(--ink);font-weight:500}
.top-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.round{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:20px;cursor:pointer;box-shadow:0 2px 14px var(--shadow-soft);display:flex;align-items:center;justify-content:center}
.t-lead{display:flex;align-items:center;gap:10px}
.t-ic{width:40px;height:30px;fill:currentColor}
.t-ic.stroke{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:28px;height:28px}
.dock{justify-content:center}
.dock button{max-width:120px}
.dock .plus{margin:0 22px}
.logo-sm{height:34px;width:auto;display:block}
.logo-sm.dk{display:none}
:root[data-theme="dark"] .logo-sm.lt{display:none}:root[data-theme="dark"] .logo-sm.dk{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-sm.lt{display:none}:root:not([data-theme="light"]) .logo-sm.dk{display:block}}
.map-card{padding:10px;gap:10px}
.map-wrap{position:relative;border-radius:20px;overflow:hidden}
.map{height:min(360px,58vh);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#f2efe9;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.map-inner{position:relative}
.map-inner img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #FFFFFF;background:var(--biet);box-shadow:0 2px 6px rgba(27,57,7,.35);cursor:pointer;padding:0}
.pin.now{background:#C9DB84;border-color:#1B3907}
.pin.soon{background:#FEC2E6;border-color:#BD475F}
.pin.later,.pin.none{background:#BD475F}
.pin.sel{width:34px;height:34px;margin:-17px 0 0 -17px;z-index:2;box-shadow:0 0 0 4px rgba(189,71,95,.35),0 2px 8px rgba(27,57,7,.4)}
.attr{pointer-events:none;position:absolute;right:8px;bottom:6px;font-size:10px;background:rgba(255,255,255,.85);color:#1B3907;padding:1px 6px;border-radius:6px}
.map-legend{padding:0 6px}
.map-legend span::before{background:#BD475F;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px rgba(27,57,7,.2)}
.map-legend span.now::before{background:#C9DB84;box-shadow:inset 0 0 0 2px #1B3907}
.map-legend span.soon::before{background:#FEC2E6;box-shadow:inset 0 0 0 2px #BD475F}
.pin-info,.map-card>.small{padding:4px 8px 8px;display:flex;flex-direction:column;gap:8px}
.top-row{margin-bottom:0}
.top-row h1{flex:1 1 auto;min-width:0;font-size:30px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-row .logo-sm{height:30px;flex:0 0 auto}
.dock{display:grid;grid-template-columns:1fr 82px 1fr;justify-items:center}
.dock button{max-width:140px}
.top{position:relative}
.help-home{position:absolute;right:0;top:0}
.help-ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock button{max-width:none;width:100%}
.dock .plus{margin:0 auto;width:54px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:var(--bos);color:var(--hemel);border-radius:18px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:25;font-size:15px;box-shadow:0 10px 30px var(--shadow)}
.toast button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;background:var(--rabarber);color:var(--bos);padding:0 14px;min-height:38px;cursor:pointer;flex:0 0 auto}
.rows{padding:6px 10px;gap:0}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 8px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:0}
.srow:first-child{border-top:0}
.srow.on{background:var(--field);border-radius:14px}
.sdot{flex:0 0 14px;height:14px;border-radius:50%;background:var(--biet)}
.sdot.now{background:var(--limoen);box-shadow:inset 0 0 0 2px var(--bos)}
.sdot.soon{background:var(--rabarber);box-shadow:inset 0 0 0 2px var(--biet)}
.sname{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.sname b{font-weight:400;font-size:16px}
.sname small{font-size:13px;color:var(--muted)}
.srow .chip{flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.title-svg{width:auto;max-width:100%;display:block;fill:currentColor;overflow:visible;margin-bottom:-8px;position:relative;top:-6px}
.top-row:has(.title-svg){align-items:flex-start}
.top-row h1:has(.title-svg){overflow:visible;white-space:normal}
.top-row h1{color:var(--title)}
.tile-title{width:auto;max-width:100%;display:block;fill:currentColor;margin:2px 0 0 -2px}
.more{align-self:flex-start;font:inherit;font-size:15px;font-weight:500;background:none;border:0;color:var(--muted);padding:6px 0;min-height:44px;cursor:pointer}
.big-chk{font-size:16px;color:var(--ink);min-height:44px}
.big-chk input{width:22px;height:22px}
.runbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));display:flex;align-items:center;gap:12px;background:var(--biet);color:#FFFFFF;border:0;border-radius:20px;padding:10px 16px;font:inherit;text-align:left;cursor:pointer;z-index:19;box-shadow:0 10px 26px var(--shadow)}
.rb-dot{flex:0 0 10px;height:10px;border-radius:50%;background:var(--rabarber);animation:pulse 1.6s ease-in-out infinite}
.rb-dot.done{background:var(--limoen)}
@media (prefers-reduced-motion:reduce){.rb-dot{animation:none}}
.rb-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.rb-txt b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-txt small{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-time{flex:0 0 auto;font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
body.has-run{padding-bottom:190px}
.toast{z-index:26}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
a.btn.ios{background:var(--b2);color:var(--b2-ink)}
@media (max-width:460px){.edit-row{grid-template-columns:1fr 80px auto}.edit-row .chk{grid-column:1/2}}
</style>

</head>

const DEFAULT={id:"standaard",builtin:true,name:"Mijn zuurdesembrood",
  ingredients:[{n:"Volkoren bloem",g:330,flour:true},{n:"Witte bloem",g:330,flour:true},{n:"Water",g:450},{n:"Zout",g:13},{n:"Zuurdesemstarter",g:130}],
  steps:[
  {t:"Starter klaarmaken",min:0,d:"Zorg dat je starter actief is: 4 tot 8 uur na het voeden, verdubbeld en vol bubbels.",tip:"Test: een lepeltje starter in water moet blijven drijven. Zakt het, wacht dan nog wat."},
  {t:"Autolyse",min:30,d:"Meng de 660 g bloem met 420 g water tot er geen droge bloem meer is. Hou 30 g water apart voor het zout. Afdekken en laten rusten."},
  {t:"Starter toevoegen",min:0,d:"Voeg 130 g starter toe en meng kort tot hij goed verdeeld is."},
  {t:"Zout toevoegen",min:0,d:"Strooi 13 g zout over het deeg en giet de achtergehouden 30 g water erbij. Meng tot alles opgenomen is."},
  {t:"KitchenAid, stand 1",min:10,d:"Kneed op stand 1."},
  {t:"KitchenAid, stand 2",min:5,d:"Kneed op stand 2.",tip:"Het deeg is goed als je een stukje dun kan uittrekken zonder dat het meteen scheurt."},
  {t:"Stretch and fold",min:30,reps:5,d:"Zet het deeg in de oven met enkel het lampje aan. Laat 30 minuten rusten, dan rekken en vouwen. Dat doe je 5 keer.",tip:"Met natte handen gaat het makkelijker."},
  {t:"Laten rijzen",min:180,d:"Laat het deeg verder rijzen in de oven met enkel het lampje aan, met een thermometer erbij: 24 tot 27 °C is ideaal. Wordt het warmer, zet dan de ovendeur op een kier. Na 3 uur kijk je naar het deeg: het is klaar als het 50 tot 75% gegroeid is, bol staat en bubbels heeft. Nog niet zo ver? Geef het extra tijd en kijk elk halfuur.",tip:"Vul bij je notitie in hoe lang het uiteindelijk duurde en hoe warm de oven was."},
  {t:"Vormen",min:0,d:"Vorm het deeg en leg het met de naad naar boven in het rijsmandje.",tip:"Bloem het mandje goed in, een beetje rijstbloem plakt het minst."},
  {t:"Nachtje in de frigo",min:720,d:"Dek af en zet in de koelkast. Tussen 12 en 16 uur is goed."},
  {t:"Oven voorverwarmen",min:45,d:"Zet de dutch oven met deksel in de oven en verwarm voor op 250 °C.",tip:"Haal het deeg pas uit de frigo als de oven klaar is. Koud deeg is makkelijker te scoren."},
  {t:"Scoren en bakken met deksel",min:30,d:"Kantel het brood op bakpapier, maak een snede en bak 30 minuten met deksel op 250 °C."},
  {t:"Bakken zonder deksel",min:15,d:"Deksel eraf, zet de oven op 230 °C en bak verder tot de korst diepbruin is. Meestal is dat 15 tot 20 minuten."},

const DESEM_PROBLEMS=[
 {k:"plat",t:"Brood is plat of loopt uit",why:["Het deeg is te lang of te warm gerezen en heeft zijn kracht verloren.","Te weinig spanning bij het vormen.","Te veel water voor deze bloem.","De starter was niet op zijn piek."],fix:["Laat het deeg rijzen tot 50 à 75% groei, niet langer. Kijk vanaf 3 uur.","Vorm strakker: trek het deeg naar je toe tot de bovenkant gespannen staat.","Probeer eens 20 à 30 g minder water.","Bak alleen als je starter goed bubbelt en drijft."]},
 {k:"dicht",t:"Kruim is dicht of plakkerig",why:["Het deeg is te kort gerezen.","De starter was te zwak.","Te vroeg aangesneden: binnenin was het nog aan het garen.","Te kort gebakken."],fix:["Geef het deeg meer tijd, tot het bol staat en vol bubbels zit.","Voed je starter een dag op voorhand twee keer.","Wacht minstens een uur voor je aansnijdt.","Bak tot de korst diepbruin is."]},
 {k:"gaten",t:"Grote gaten bovenaan, dicht onderaan",why:["De gisting was nog niet klaar.","Het deeg was te koud tijdens het rijzen."],fix:["Laat het langer rijzen, of zet het iets warmer (24 à 27 °C).","Kijk naar het deeg, niet naar de klok."]},

/* ---------- helpers ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")}
function durLabel(min){if(!min)return "";return min>=60?(Math.round(min/6)/10)+" u":min+" min"}
function dateLabel(ts){return ts?new Date(ts).toLocaleDateString("nl-BE",{weekday:"short",day:"numeric",month:"short"}):""}
function timeLabel(ts){return new Date(ts).toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"})}
function toInput(ts){const d=new Date(ts||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fromInput(v){if(!v)return Date.now();const [y,m,d]=v.split("-").map(Number);const n=new Date();return new Date(y,m-1,d,n.getHours(),n.getMinutes()).getTime()}
function daysAgo(ts){const a=new Date(ts);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function agoLabel(ts){const d=daysAgo(ts);return d<=0?"vandaag":d===1?"gisteren":d+" dagen geleden"}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(p){return p+Date.now()+Math.floor(Math.random()*1000)}
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function setStatus(t){document.getElementById("status").textContent=t}
const $=id=>document.getElementById(id);

/* ---------- list stores (browser first, account when available) ---------- */
function makeStore(key,sortFn){
  return {items:lsGet(key,[]).sort(sortFn),col:null,
    save(it){this.items=[...this.items.filter(x=>x.id!==it.id),it].sort(sortFn);lsSet(key,this.items);if(this.col)queue(()=>this.col.doc(it.id).set(it))},
    del(id){this.items=this.items.filter(x=>x.id!==id);lsSet(key,this.items);if(this.col)queue(()=>this.col.doc(id).delete())},
    get(id){return this.items.find(x=>x.id===id)},
    attach(col){this.col=col;let first=true;
      col.onSnapshot(s=>{const remote=s.docs.map(x=>clone(x.data())),ids=new Set(remote.map(x=>x.id));
        if(first){this.items.filter(x=>!ids.has(x.id)).forEach(it=>{remote.push(it);queue(()=>col.doc(it.id).set(it))});first=false}
        this.items=remote.sort(sortFn);lsSet(key,this.items);safeRender()},()=>{})}};
}

/* ---------- overzicht ---------- */
function home(){
  const lastBake=S.bakes.items[0], feed=scoby.feeds[0], open=S.kbBatch.items.filter(b=>!b.evaluated).length, lastSap=S.sap.items[0], left=scobyLeft();
  const q=[];
  if(active)q.push(`<button class="qcard b" data-go="zd"><span class="lbl">Brood bezig</span><span class="big">${active.finished?"Klaar":"Stap "+(active.step+1)}</span><span class="sub">${active.finished?"Geef het een score":esc(steps()[active.step].t)}</span></button>`);
  if(left!=null)q.push(`<button class="qcard r" data-go="kb" data-to="scoby"><span class="lbl">Scoby voeden</span><span class="big">${left>1?left+" dagen":left===1?"Morgen":left===0?"Vandaag":"Te laat"}</span><span class="sub">${left>1?"tot de volgende keer":left===1?"is het weer tijd":left===0?"is het tijd":-left+(left===-1?" dag":" dagen")+" over tijd"}</span></button>`);
  plukGroups().forEach(g=>q.push(`<button class="qcard ${g.st==="now"?"l":"h"}" data-go="pluk"><span class="lbl">${g.st==="now"?"Nu plukken":"Bijna plukken"}</span><span class="big">${esc(g.name)}</span><span class="sub">${g.st==="now"?(g.n>1?g.n+" plekken":"1 plek"):"over "+g.days+(g.days===1?" dag":" dagen")}</span></button>`));
  const exp=S.kast.items.filter(i=>(+i.count||0)>0&&i.best&&daysUntil(i.best)<=14);
  if(exp.length)q.push(`<button class="qcard r" data-go="kast"><span class="lbl">Voorraad</span><span class="big">${exp.length}</span><span class="sub">${exp.length===1?"bijna over datum":"bijna over datum"}</span></button>`);
  if(open)q.push(`<button class="qcard l" data-go="kb" data-to="log"><span class="lbl">Kombucha</span><span class="big">${open}</span><span class="sub">${open===1?"nog te proeven":"nog te proeven"}</span></button>`);
  const zd=active?`${esc(active.recipeName||DEFAULT.name)} is bezig`:lastBake?`Laatst gebakken ${dateLabel(lastBake.startedAt)}`:"Bak je eerste brood";
  const kb=feed?`Scoby gevoed ${agoLabel(feed.at)}`:"Hou je scoby en batches bij";
  const sp=lastSap?`Laatste: ${esc(lastSap.name)}`:"Hou bij wat je met de sappan maakt";
  const nowN=S.pluk.items.filter(x=>spotStatus(x).st==="now").length, inKast=S.kast.items.filter(i=>(+i.count||0)>0);
  const pl=S.pluk.items.length?(nowN?`${nowN} ${nowN===1?"plek":"plekken"} om nu te plukken`:`${S.pluk.items.length} plukplekken`):"Zet je plukplekken erin";
  const kn=inKast.reduce((a,i)=>a+(+i.count||0),0),ka=inKast.length?(kn===1?"1 potje of fles":`${kn} potjes en flessen`):"Hou je potjes en flessen bij";
  const tile=(c,label,name,info)=>`<button class="tile ${c}" data-go="${c}"><span class="t-top"><span class="t-lead"><span class="t-label">${label}</span></span><span class="t-arrow" aria-hidden="true">→</span></span><span class="t-name">${TILE_TITLES.includes(c)?`<span class="sr">${name}</span>${TITLE_SVG[c].replace('class="title-svg"','class="tile-title"').replace(/margin-top:[^;"]*/,"margin-top:0")}`:name}</span><span class="t-info">${info}</span></button>`;
  return `<div class="stack">
    ${q.length?`<div class="stack" style="gap:10px"><div class="section-title"><h2>Vandaag</h2></div><div class="quick">${q.join("")}</div></div>`:""}
    <div class="wallet">${tile("zd","Bakken","Desem",zd)}${tile("kb","Fermenteren","Kombucha",kb)}${tile("sap","Sappan","Sappen",sp)}${tile("pluk","Buiten","Wildpluk",pl)}</div>
    <div class="row tight" style="justify-content:center"><button class="btn soft sm" data-act="backup">Reservekopie maken</button><label class="btn soft sm file" for="restore-file">Reservekopie terugzetten<input id="restore-file" type="file" accept=".json,application/json" hidden></label></div>
  </div>`;
}

/* ---------- zuurdesem ---------- */
function zdSelect(cur,id){return `<label for="${id}">Recept<select id="${id}">${zdRecipes().map(r=>`<option value="${esc(r.id)}" ${r.id===cur?"selected":""}>${esc(r.name)}</option>`).join("")}</select></label>`}
function stepList(list,cur){
  return `<ol class="steps">${list.map((s,i)=>{const cls=cur==null?"":i<cur?"done":i===cur?"now":"";
    return `<li class="${cls}"><span class="n">${cur!=null&&i<cur?"✓":String(i+1).padStart(2,"0")}</span><span>${esc(s.t)}${s.reps>1?" ×"+s.reps:""}</span><span class="dur">${durLabel(s.min)}</span></li>`}).join("")}</ol>`;
}
function zdIdle(){
  const r=getZd(selId), last=S.bakes.items.find(b=>(b.recipeId||"standaard")===r.id),{flour}=hydration(r);
  return `<div class="stack"><section class="card">
    ${zdSelect(r.id,"zd-sel")}
    <p>${esc(r.ingredients.map(i=>i.g+" g "+i.n.toLowerCase()).join(", "))}.</p>
    ${last?`<p class="status">Vorige keer: ${dateLabel(last.startedAt)}${last.score?" · "+"★".repeat(last.score):""}${last.next?" · Volgende keer: "+esc(last.next):""}</p>`:""}
    <button class="btn primary big" data-act="start">Start met bakken</button>
  </section>
  ${flour?(calcOpen?calcCard(r):`<button class="btn soft" data-act="calc-open">Groter of kleiner brood? Reken het om</button>`):""}
  <section class="card"><h3>De stappen</h3>${stepList(r.steps,null)}</section></div>`;
}
function calcCard(r){const {flour}=hydration(r);return `<section class="card"><div class="row between"><h3>Rekenhulp</h3><button class="x" data-act="calc-close" aria-label="Rekenhulp sluiten">×</button></div>
    <label for="calc-flour">Hoeveel bloem wil je gebruiken?<span class="row" style="gap:8px;flex-wrap:nowrap"><input id="calc-flour" type="number" inputmode="numeric" min="50" step="10" value="${calcFlour||flour}" style="max-width:140px"><span class="small">gram</span></span></label>
    <div class="chips">${[0.5,1,1.5,2].map(f=>`<button data-act="calc" data-n="${Math.round(flour*f)}" aria-pressed="${(calcFlour||flour)===Math.round(flour*f)}">${f===1?"Gewoon":f===0.5?"Half":"×"+String(f).replace(".",",")}</button>`).join("")}</div>
    <div class="recipe">${r.ingredients.map(i=>`<span>${esc(i.n)}</span><span>${Math.round(i.g*(calcFlour||flour)/flour)} g</span><span>${i.g?Math.round(i.g/flour*100)+"%":""}</span>`).join("")}
    <span class="sum">Totaal deeg</span><span class="sum">${Math.round(r.ingredients.reduce((a,i)=>a+(+i.g||0),0)*(calcFlour||flour)/flour)} g</span><span class="sum"></span></div>
    <p class="small">De verhoudingen blijven hetzelfde. Hou er rekening mee dat een groter brood ook iets langer moet bakken.</p></section>`}
function zdActive(){
  const list=steps(), s=list[active.step], i=active.step, pct=Math.round(i/list.length*100);
  const r=remaining(), running=active.stepStart!=null, done=active.reps||0, reps=s.reps>1?s.reps:0;
  const C=2*Math.PI*100, frac=running?Math.max(0,r)/(s.min*60000):1;
  const timer=s.min&&settings.ios?`<div class="phone-t"><span class="pt-ico" aria-hidden="true">⏰</span><div><b>${running?"Timer loopt op je iPhone":durLabel(s.min)}</b><small>${running?"Klaar om "+timeLabel(active.stepStart+s.min*60000):"Je iPhone-timer start als je op de knop tikt"}</small></div></div>`
    :s.min?`<div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="100" fill="none" stroke-width="12"/><circle class="prog" id="ring-p" cx="110" cy="110" r="100" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="${running?"":"opacity:.35"}"/></svg>
      <div class="rt"><div class="timer${running&&r<=0?" done":""}" id="timer">${running?fmt(r):fmt(s.min*60000)}</div>
      <p class="timer-sub" id="timer-sub">${running?(r<=0?"Tijd is om!":"Klaar om "+timeLabel(active.stepStart+s.min*60000)):"Nog niet gestart"}</p></div></div>`:"";
  let actions;

async function shrink(file){
  try{const bmp=await createImageBitmap(file);const m=1600,sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));}
  catch(e){return file}
}

function spotWin(sp){const P=PLANT[sp.plant];const s=sp.s||(P&&P.s),e=sp.e||(P&&P.e);return s&&e?{s,e}:null}

async function readImport(file){
  const name=file.name.toLowerCase();let out=[];
  const pmFromKml=text=>{const doc=new DOMParser().parseFromString(text,"text/xml");
    return [...doc.getElementsByTagName("Placemark")].map(pm=>{
      const nm=(pm.getElementsByTagName("name")[0]||{}).textContent||"Plek";
      const ds=((pm.getElementsByTagName("description")[0]||{}).textContent||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      const c=((pm.getElementsByTagName("coordinates")[0]||{}).textContent||"").trim().split(/\s+/)[0].split(",");
      let folder="",n=pm.parentNode;while(n&&n.nodeName!=="#document"){if(n.nodeName==="Folder"){const f=[...n.children].find(x=>x.nodeName==="name");folder=f?f.textContent:"";break}n=n.parentNode}
      return {name:nm.trim(),note:ds,lat:c.length>1?+c[1]:null,lng:c.length>1?+c[0]:null,hint:folder}})};
  if(name.endsWith(".kmz")){if(!window.JSZip)throw new Error("zip");const z=await JSZip.loadAsync(file);const k=Object.values(z.files).find(f=>f.name.toLowerCase().endsWith(".kml"));if(!k)throw new Error("kml");out=pmFromKml(await k.async("text"))}
  else if(name.endsWith(".kml"))out=pmFromKml(await file.text());
  else if(name.endsWith(".json")||name.endsWith(".geojson")){const j=JSON.parse(await file.text());
    out=(j.features||[]).map(f=>{const p=f.properties||{},c=(f.geometry||{}).coordinates||[];
      return {name:(p.name||p.Title||p.title||(p.location&&p.location.name)||"Plek").trim(),note:p.description||p.Comment||p.comment||"",lat:c.length>1?+c[1]:null,lng:c.length>1?+c[0]:null,url:p.google_maps_url||p["Google Maps URL"]||"",hint:""}})}
  else if(name.endsWith(".csv")){const rows=(await file.text()).split(/\r?\n/).filter(Boolean).map(l=>{const r=[];let cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){r.push(cur);cur=""}else cur+=ch}r.push(cur);return r});
    const h=rows.shift().map(x=>x.trim().toLowerCase()),ti=h.indexOf("title"),no=h.indexOf("note"),ur=h.indexOf("url");
    out=rows.map(r=>{const u=r[ur]||"",m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
      return {name:(r[ti]||"Plek").trim(),note:r[no]||"",lat:m?+m[1]:null,lng:m?+m[2]:null,url:m?"":u,hint:""}}).filter(x=>x.name)}
  else throw new Error("type");
  return out.filter(x=>x.name).map(x=>({...x,plant:matchPlant(x.name+" "+x.hint+" "+x.note)}));
}

  const el=$("timer");if(!el||!active||!active.stepStart)return;
  const r=remaining();el.textContent=fmt(r);
  const rp=$("ring-p");if(rp){const C=2*Math.PI*100,tot=steps()[active.step].min*60000;rp.setAttribute("stroke-dashoffset",C*(1-Math.max(0,r)/tot))}
  const key=active.step+"-"+active.stepStart;
  if(r<=0){el.classList.add("done");$("timer-sub").textContent="Tijd is om!";
    if(!alerted.has(key)){alerted.add(key);beep();document.title="⏰ Tijd is om! · Kitchen Witch"}}
}
setInterval(tick,1000);

/* ---------- input reading ---------- */
function readInputs(){
  if(draft){
    if(sec==="zd")readZdDraft();
    if(sec==="kb"&&sub.kb==="log")readKbDraft();
    if(sec==="kb"&&sub.kb==="rec"&&$("kr-name")){draft.name=val("kr-name");draft.ingredients=val("kr-ing");draft.method=val("kr-method");draft.notes=val("kr-notes")}
    if(sec==="pluk")readPlukDraft();
    if(sec==="zd")readBakeDraft();
    if(sec==="kast")readKastDraft();
    if(sec==="sap"&&$("sp-name")){draft.name=val("sp-name");draft.date=fromInput(val("sp-date"));rv("sp-ing","ingredients");rv("sp-amount","amount");rv("sp-stock","stock");rv("sp-notes","notes")}
  }
  if(active&&sec==="zd"){if($("note")){active.notes=active.notes||{};active.notes[active.step]=val("note")}if($("temp"))active.temp=val("temp")}
  ["good","bad","next"].forEach(k=>{if($(k))result[k]=val(k)});
}
function fail(msg){render();$("err").textContent=msg}

document.addEventListener("click",e=>{
  const tu=e.target.closest("[data-toast]");if(tu){if(toastUndo)toastUndo();toastUndo=null;$("toast").hidden=true;return}

  const bk=e.target.closest("[data-back]");if(bk&&navDepth>0){history.back();return}if(bk){readInputs();if(active&&sec==="zd")saveActive();if(draft||importPreview){draft=null;importPreview=null;confirmDel=null}else{sec="home";confirmDel=null}render();window.scrollTo(0,0);return}
  const sh=e.target.closest("[data-sheet]");if(sh){sheet(true);return}
  const qk=e.target.closest("[data-quick]");if(qk){quick(qk.dataset.quick);return}
  const go=e.target.closest("[data-go]");if(go){readInputs();if(active&&sec==="zd")saveActive();if(go.dataset.go==="hulp"&&(sec==="zd"||sec==="kb"))sub.hulp=sec;sec=go.dataset.go;if(go.dataset.to)sub[sec]=go.dataset.to;if(sec==="zd"&&active)sub.zd="bake";draft=null;confirmDel=null;render();window.scrollTo(0,0);return}
  if(e.target.closest("[data-home]")){readInputs();if(active&&sec==="zd")saveActive();sec="home";draft=null;confirmDel=null;render();return}
  const tb=e.target.closest("#sub button");if(tb){readInputs();sub[sec]=tb.dataset.sub;draft=null;confirmDel=null;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,k=+b.dataset.k,id=b.dataset.id;readInputs();document.title="Kitchen Witch";
  const tBefore=active?active.step+"-"+active.stepStart:"";
  switch(act){
    case "start":{const r=getZd(selId);active={id:uid("b"),startedAt:Date.now(),recipeId:r.id,recipeName:r.name,steps:clone(r.steps),step:0,stepStart:null,reps:0,notes:{},temp:"",stepDone:{}};confirmStop=false;keepAwake(!settings.ios);saveActive();break}
    case "timer":active.stepStart=Date.now();keepAwake(!settings.ios);saveActive();break;
    case "fold":active.reps=(active.reps||0)+1;if(active.reps>=steps()[active.step].reps)nextStep();else active.stepStart=Date.now();keepAwake(!settings.ios);saveActive();break;
    case "next":nextStep();saveActive();break;
    case "prev":active.step=Math.max(0,active.step-1);active.stepStart=null;active.reps=0;saveActive();break;
    case "stop":confirmStop=true;break;
    case "stop-no":confirmStop=false;break;
    case "stop-yes":active=null;confirmStop=false;keepAwake(false);saveActive();break;
    case "score":result.score=+b.dataset.n;break;
    case "save-bake":S.bakes.save({...active,finished:true,problems:result.problems||[],photos:result.photos||[],score:result.score,good:result.good||"",bad:result.bad||"",next:result.next||"",endedAt:Date.now()});const savedId=active.id;lastTips=((result.problems||[]).length||(result.photos||[]).length)?{sec:"zd",keys:result.problems||[],bakeId:savedId}:null;if(lastTips)adviseBake(savedId);active=null;result={score:0};keepAwake(false);saveActive();sub.zd="log";window.scrollTo(0,0);break;
    case "zd-new":draft={isNew:true,id:uid("r"),name:"",ingredients:[{n:"",g:"",flour:true}],steps:[{t:"",min:0,reps:0,d:"",tip:""}]};break;
    case "zd-copy":{const r=getZd(recView);draft={...clone(r),isNew:true,builtin:false,id:uid("r"),created:0,name:r.name+" (kopie)"};break}
    case "zd-edit":draft={...clone(getZd(recView)),isNew:false};break;
    case "ing-add":draft.ingredients.push({n:"",g:"",flour:false});break;
    case "ing-del":draft.ingredients.splice(k,1);break;
    case "st-add":draft.steps.push({t:"",min:0,reps:0,d:"",tip:""});break;
    case "st-del":draft.steps.splice(k,1);break;
    case "st-up":{const s=draft.steps.splice(k,1)[0];draft.steps.splice(k-1,0,s);break}
    case "zd-save":{const ing=draft.ingredients.filter(i=>String(i.n).trim()),st=draft.steps.filter(s=>s.t.trim());
      if(!draft.name.trim())return fail("Geef je recept een naam.");if(!st.length)return fail("Voeg minstens één stap met een titel toe.");
      const r={id:draft.id,name:draft.name.trim(),created:draft.created||Date.now(),ingredients:ing.map(i=>({n:i.n.trim(),g:+i.g||0,flour:!!i.flour})),
        steps:st.map(s=>{const o={t:s.t.trim(),min:+s.min||0,d:s.d.trim()};if(s.reps>1)o.reps=+s.reps;if(s.tip&&s.tip.trim())o.tip=s.tip.trim();return o})};
      S.zdRec.save(r);recView=r.id;selId=r.id;lsSet("kw-sel",selId);draft=null;break}
    case "cancel":draft=null;break;
    case "prob":{const p=result.problems||[];result.problems=p.includes(b.dataset.k)?p.filter(x=>x!==b.dataset.k):[...p,b.dataset.k];break}
    case "kbprob":{const p=draft.problems||[];draft.problems=p.includes(b.dataset.k)?p.filter(x=>x!==b.dataset.k):[...p,b.dataset.k];break}
    case "pl-new":draft=newSpot();break;
    case "pl-edit":draft={...clone(S.pluk.get(id)),isNew:false};break;
    case "pl-save":{const {isNew,...it}=draft;it.name=(it.name||"").trim();if(!it.name)return fail("Geef je plek een naam.");it.created=it.created||Date.now();S.pluk.save(it);draft=null;break}
    case "pin":{if(b.dataset.scroll){selPin=id;const sp=S.pluk.get(id),p=sp&&onMap(sp),m=$("map");if(p&&m)mapScroll=[p.x*MAP.sc-m.clientWidth/2,p.y*MAP.sc-m.clientHeight/2];render();const mc=document.querySelector(".map-card");if(mc)mc.scrollIntoView({behavior:"smooth",block:"start"});return}selPin=selPin===id?null:id;break}
    case "imp-no":importPreview=null;break;
    case "imp-list":importPreview=listTodo().map(x=>({...x,url:"",plant:matchPlant(x.name)}));window.scrollTo(0,0);break;
    case "imp-yes":{const have=new Set(S.pluk.items.map(x=>x.name+"|"+x.lat+"|"+x.lng));let n=0,t=Date.now();
      importPreview.forEach(x=>{if(have.has(x.name+"|"+x.lat+"|"+x.lng))return;const P=PLANT[x.plant];
        S.pluk.save({id:uid("p")+n,name:x.name,plant:x.plant||"",s:P?P.s:null,e:P?P.e:null,note:x.note||"",lat:x.lat,lng:x.lng,url:x.url||"",created:t+n});n++});
      importPreview=null;setStatus(n?n+" plekken toegevoegd.":"Deze plekken stonden er al in.");break}
    case "k-new":draft=newKast();break;
    case "k-edit":draft={...clone(S.kast.get(id)),isNew:false};break;
    case "k-min":case "k-plus":{const it=S.kast.get(id);if(it)S.kast.save({...it,count:Math.max(0,(+it.count||0)+(act==="k-plus"?1:-1))});break}
    case "k-save":{const {isNew,...it}=draft;it.name=(it.name||"").trim();if(!it.name)return fail("Geef het een naam.");S.kast.save(it);draft=null;break}
    case "to-kast":{const src=b.dataset.from==="sap"?S.sap.get(id):S.kbBatch.get(id);sec="kast";
      draft={...newKast(),name:src?src.name:"",type:b.dataset.from==="sap"?"Sap":"Kombucha",date:src?src.date:Date.now(),from:id};window.scrollTo(0,0);break}
    case "del":confirmDel={type:b.dataset.type,id};break;
    case "del-no":confirmDel=null;break;
    case "del-yes":{S[confirmDel.type].del(confirmDel.id);if(confirmDel.type==="zdRec"){recView="standaard";if(selId===confirmDel.id){selId="standaard";lsSet("kw-sel",selId)}}confirmDel=null;break}
    case "feed":{const f={at:fromInput(val("feed-date")),note:val("feed-note").trim()};scoby.feeds.push(f);saveScoby();toast("Scoby gevoed genoteerd.",()=>{scoby.feeds=scoby.feeds.filter(x=>x!==f);saveScoby();render()});break}
    case "kb-new":draft={isNew:true,id:uid("k"),name:"",date:Date.now(),recipeId:"",sapId:"",amount:"",notes:"",evaluated:false,wrong:false,score:0};break;
    case "kb-edit":draft={...clone(S.kbBatch.get(id)),isNew:false,stock:(kastFor(id)||{}).count??""};break;
    case "kb-eval":{const v=b.dataset.v,on=draft.evaluated&&(draft.wrong?"bad":"ok")===v;draft.evaluated=!on;draft.wrong=!on&&v==="bad";break}
    case "kb-more":case "sap-more":draft.more=!draft.more;break;
    case "res-more":result.more=!result.more;break;
    case "kb-score":draft.score=+b.dataset.n;break;
    case "kb-save":{const {isNew,stock,more,saveRec,...it}=draft;if(saveRec&&it.name.trim())S.kbRec.save({id:uid("kr"),name:it.name.trim(),ingredients:"",method:it.notes||"",notes:"Gemaakt op "+dateLabel(it.date),created:Date.now()});it.name=it.name.trim();if(!it.name)return fail("Geef je kombucha een naam of smaak.");S.kbBatch.save(it);syncStock(it,"Kombucha",stock);lastTips=it.wrong&&(it.problems||[]).length?{sec:"kb",keys:it.problems}:null;draft=null;window.scrollTo(0,0);break}
    case "tips-close":lastTips=null;break;
    case "ask-claude":shareAdvice(id);return;
    case "calc":calcFlour=+b.dataset.n;break;
    case "calc-open":calcOpen=true;break;
    case "calc-close":calcOpen=false;calcFlour=null;break;
    case "backup":{backup();return}
    case "bk-edit":draft={...clone(S.bakes.get(id)),isNew:false};window.scrollTo(0,0);break;
    case "bk-score":draft.score=+b.dataset.n;break;
    case "bkprob":{const p=draft.problems||[];draft.problems=p.includes(b.dataset.k)?p.filter(x=>x!==b.dataset.k):[...p,b.dataset.k];break}
    case "bk-save":{const cur=S.bakes.get(draft.id)||{};const {isNew,...it}=draft;S.bakes.save({...it,photos:cur.photos||it.photos||[]});lastTips=(it.problems||[]).length?{sec:"zd",keys:it.problems}:null;draft=null;window.scrollTo(0,0);break}
    case "kbr-new":draft={isNew:true,id:uid("kr"),name:"",ingredients:"",method:"",notes:""};break;
    case "kbr-edit":draft={...clone(S.kbRec.get(id)),isNew:false};break;
    case "kbr-save":{const {isNew,...it}=draft;it.name=it.name.trim();if(!it.name)return fail("Geef je recept een naam.");it.created=it.created||Date.now();S.kbRec.save(it);draft=null;break}
    case "sap-new":draft={isNew:true,id:uid("s"),name:"",date:Date.now(),ingredients:"",amount:"",notes:"",score:0};break;
    case "sap-edit":draft={...clone(S.sap.get(id)),isNew:false,stock:(kastFor(id)||{}).count??""};break;
    case "sap-score":draft.score=+b.dataset.n;break;
    case "sap-save":{const {isNew,stock,more,...it}=draft;it.name=it.name.trim();if(!it.name)return fail("Geef je sap een naam.");S.sap.save(it);syncStock(it,"Sap",stock);draft=null;break}
  }
  phoneTimer(tBefore);
  render();
});
function phoneTimer(before){
  if(!settings.ios||!active||active.finished||!active.stepStart)return;
  if(active.step+"-"+active.stepStart===before)return;
  const s=steps()[active.step];if(!s||!s.min)return;
  location.href=sc("KW Timer",String(Math.max(1,Math.round(s.min))));
}
let toastT=null,toastUndo=null;
function toast(msg,undo){const t=$("toast");toastUndo=undo||null;t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button data-toast="undo">Ongedaan maken</button>`:""}`;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;toastUndo=null},7000)}
let navDepth=0,lastHash=null;
const HSEC={home:"overzicht",zd:"desem",kb:"kombucha",sap:"sappen",pluk:"wildpluk",kast:"voorraad",hulp:"hulp"};
const HSEC_R=Object.fromEntries(Object.entries(HSEC).map(([k,v])=>[v,k]));
function stateHash(){if(sec==="home")return "overzicht";return HSEC[sec]+"-"+sub[sec]+(draft?"-bewerken":"")}
function syncHash(){const h=stateHash();if(location.hash==="#"+h){lastHash=h;return}
  if(lastHash&&lastHash===h+"-bewerken"&&navDepth>0){lastHash=h;navDepth--;try{history.back()}catch(e){}return}const same=lastHash&&lastHash.split("-")[0]===h.split("-")[0]&&!/-bewerken$/.test(lastHash)&&!/-bewerken$/.test(h);
  lastHash=h;try{if((location.hash||navDepth)&&!same){history.pushState(null,"","#"+h);navDepth++}else history.replaceState(null,"","#"+h)}catch(e){}}
function applyHash(){const h=(location.hash||"").slice(1);if(!h||h===lastHash)return;const [a,b,c]=h.split("-");const sc=HSEC_R[a];if(!sc)return;
  readInputs();if(active&&sec==="zd")saveActive();navDepth=Math.max(0,navDepth-1);
  sec=sc;if(b&&SECS[sc]&&SECS[sc].subs.some(x=>x[0]===b))sub[sc]=b;if(c!=="bewerken"){draft=null;importPreview=null}confirmDel=null;sheet(false);render()}
window.addEventListener("popstate",applyHash);window.addEventListener("hashchange",applyHash);
function sheet(open){$("sheet").hidden=!open;$("sheet-bg").hidden=!open;if(open)$("sheet").querySelector(".act").focus()}
function quick(k){
  sheet(false);if(k==="close")return;readInputs();confirmDel=null;
  if(k==="bake"){sec="zd";sub.zd="bake";draft=null}
  if(k==="feed"){const f={at:Date.now(),note:""};scoby.feeds.push(f);saveScoby();sec="kb";sub.kb="scoby";draft=null;
    toast("Scoby gevoed vandaag genoteerd.",()=>{scoby.feeds=scoby.feeds.filter(x=>x!==f);saveScoby();render()})}
  if(k==="kb"){sec="kb";sub.kb="log";draft={isNew:true,id:uid("k"),name:"",date:Date.now(),recipeId:"",sapId:"",amount:"",notes:"",evaluated:false,wrong:false,score:0}}
  if(k==="pluk"){sec="pluk";sub.pluk="plekken";draft=newSpot()}
  if(k==="kast"){sec="kast";draft=newKast()}
  if(k==="sap"){sec="sap";draft={isNew:true,id:uid("s"),name:"",date:Date.now(),ingredients:"",amount:"",notes:"",score:0}}
  render();window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)sheet(false)});
function kastFor(id){return S.kast.items.find(k=>k.from===id)}
function syncStock(src,type,stock){
  if(stock===""||stock==null)return;const n=Math.max(0,+stock||0),ex=kastFor(src.id);
  if(ex){if(ex.count!==n||ex.name!==src.name)S.kast.save({...ex,count:n,name:src.name})}
  else if(n>0){const {isNew,...base}=newKast();S.kast.save({...base,name:src.name,type,count:n,unit:"flessen",date:src.date||Date.now(),from:src.id})}
}
function newSpot(){return {isNew:true,id:uid("p"),name:"",plant:"",s:null,e:null,note:"",lat:null,lng:null,url:""}}
function newKast(){return {isNew:true,id:uid("v"),name:"",type:"Sap",count:1,unit:"flessen",date:Date.now(),best:null,note:""}}
function nextStep(){active.stepDone=active.stepDone||{};active.stepDone[active.step]=Date.now();active.stepStart=null;active.reps=0;
  if(active.step>=steps().length-1)active.finished=true;else{active.step++;if(steps()[active.step].min>0)active.stepStart=Date.now()}}

document.addEventListener("change",e=>{
  const t=e.target.id;
  if(t==="note"||t==="temp"){readInputs();saveActive()}
  if(t==="zd-sel"){calcFlour=null;selId=e.target.value;lsSet("kw-sel",selId);render()}
  if(t==="zd-view"){recView=e.target.value;confirmDel=null;calcFlour=null;render()}
  if(t==="calc-flour"){calcFlour=Math.max(1,+e.target.value||0)||null;render()}
  if(t==="lead"){settings.lead=Math.max(1,+e.target.value||14);lsSet("kw-settings",settings);if(settingsRef)queue(()=>settingsRef.set(settings));render()}
  if(t==="pl-plant"){readPlukDraft();const P=PLANT[draft.plant];if(P){draft.s=P.s;draft.e=P.e}render()}
  if(t.startsWith("photo-"))addPhoto(e.target);
  if(t==="ios-on"){settings.ios=e.target.checked;lsSet("kw-settings",settings);if(settingsRef)queue(()=>settingsRef.set(settings));render()}
  if(t==="restore-file"){const f=e.target.files&&e.target.files[0];if(f)restore(f)}
  if(t==="imp-file"){const f=e.target.files&&e.target.files[0];if(!f)return;busy="imp";render();
    readImport(f).then(list=>{busy="";if(!list.length){render();$("err").textContent="Er stonden geen plekken in dit bestand.";return}importPreview=list;render()})
      .catch(()=>{busy="";render();$("err").textContent="Dit bestand kon ik niet lezen. Kies een KML-, KMZ-, GeoJSON- of CSV-bestand van Google."})}
  if(t==="feed-every"){scoby.every=Math.max(1,+e.target.value||7);saveScoby();render()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&active&&!active.finished)keepAwake(!settings.ios)});

if(!zdRecipes().some(r=>r.id===selId))selId="standaard";
render();
setTimeout(()=>{if(!settingsRef){seedList();safeRender()}},4000);

(async()=>{
  try{
    if(!window.claude?.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    const me=u?await u.id():null;
    if(!d||!me)return;
    const P="data/users/"+me;
    activeRef=d.doc(P+"/actief");scobyRef=d.doc(P+"/scoby");
    S.bakes.attach(d.doc(P+"/zuurdesem").collection("broden"));
    S.zdRec.attach(d.doc(P+"/zuurdesem").collection("recepten"));
    S.kbBatch.attach(d.doc(P+"/kombucha").collection("batches"));
    S.kbRec.attach(d.doc(P+"/kombucha").collection("recepten"));
    S.sap.attach(d.doc(P+"/sappen").collection("sappen"));
    S.pluk.attach(d.doc(P+"/wildpluk").collection("plekken"));
    S.kast.attach(d.doc(P+"/voorraad").collection("items"));
    settingsRef=d.doc(P+"/instellingen");
    settingsRef.get().then(s=>{if(s.exists){settings={...settings,...s.data()};lsSet("kw-settings",settings)}setTimeout(()=>{seedList();safeRender()},1500)}).catch(()=>{});
    claude.use("assets").then(a=>{assetsNS=a;safeRender()}).catch(()=>{});
    claude.use("sample").then(f=>{if(f){sampleFn=f;safeRender()}}).catch(()=>{});
    let first=true;
    activeRef.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;const data=s.exists?s.data():null;
      if(first&&!data&&active){first=false;saveActive();return}first=false;
      active=data?clone(data):null;lsSet("kw-active",active);if(sec==="zd")safeRender()},()=>{});
    let firstS=true;
    scobyRef.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;const data=s.exists?s.data():null;
      if(firstS&&!data&&scoby.feeds.length){firstS=false;saveScoby();return}firstS=false;
      scoby=data?clone(data):{feeds:[]};if(!scoby.feeds)scoby.feeds=[];lsSet("kw-scoby",scoby);safeRender()},()=>{});
  }catch(e){}
})();
</script>
